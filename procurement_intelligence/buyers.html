<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buyer Procurement Intelligence</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#647084;--line:#d9e0ea;--blue:#2563eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}.shell{max-width:1600px;margin:auto;padding:24px}.header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}.header h1{margin:0;font-size:24px}.header p{margin:5px 0 0;color:var(--muted)}.link{color:var(--blue);text-decoration:none}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}.metric,.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 20px rgba(23,32,51,.05)}.metric{padding:15px}.metric b{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}.metric strong{display:block;font-size:27px;margin-top:9px}.controls{padding:12px;margin-bottom:16px;display:grid;grid-template-columns:2fr 1fr;gap:10px}.controls label{display:block;color:var(--muted);font-size:11px;font-weight:700;margin-bottom:5px}.controls input,.controls select{width:100%;min-height:38px;border:1px solid var(--line);border-radius:7px;padding:8px;background:#fbfdff;color:var(--ink)}.table-wrap{overflow:auto;max-height:720px}.panel{overflow:hidden}table{width:100%;min-width:1250px;border-collapse:collapse}th{position:sticky;top:0;background:#f3f6fa;color:var(--muted);font-size:11px;text-align:left;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--line);z-index:1}td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}.buyer{font-weight:750}.sub{color:var(--muted);font-size:12px;margin-top:3px}.num{font-weight:800}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:1000px){.metrics{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr}}@media(max-width:600px){.metrics{grid-template-columns:1fr 1fr}.shell{padding:14px}}
</style>
</head>
<body>
<div class="shell">
<header class="header"><div><h1>Buyer Procurement Intelligence</h1><p>Account-level procurement history derived from external notices and awards.</p></div><a class="link" href="dashboard.html">← External Procurement</a></header>
<section class="metrics" id="metrics"></section>
<section class="panel controls"><div><label>Search buyer, country, category or source</label><input id="search" placeholder="e.g. Ministry of Health, Kenya, laboratory…"></div><div><label>Country</label><select id="country"><option value="">All countries</option></select></div></section>
<section class="panel table-wrap"><table><thead><tr><th>Buyer</th><th>Country</th><th>Events</th><th>Active</th><th>Plans / GPN</th><th>Awards</th><th>High Faram</th><th>Est. Value</th><th>Latest</th><th>Next Closing</th><th>IATI Links</th><th>Categories</th></tr></thead><tbody id="rows"></tbody></table></section>
</div>
<script>
const DATA="../data/procurement_events.csv";let events=[];
const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;");
const num=v=>Number(v||0);const money=v=>num(v)?new Intl.NumberFormat("en-US",{maximumFractionDigits:0}).format(num(v)):"—";
function aggregate(source){const groups=new Map();for(const e of source){const buyer=(e.buyer||"").trim();if(!buyer)continue;const country=(e.country||"").trim();const key=buyer+"\u0000"+country;if(!groups.has(key))groups.set(key,{buyer,country,events:[],categories:new Set(),sources:new Set(),projects:new Set()});const g=groups.get(key);g.events.push(e);if(e.equipment_category)g.categories.add(e.equipment_category);if(e.source)g.sources.add(e.source);if(e.project_reference)g.projects.add(e.project_reference)}return [...groups.values()].map(g=>{const pubs=g.events.map(e=>e.publication_date).filter(Boolean).sort();const closes=g.events.map(e=>e.closing_date).filter(Boolean).sort();return{...g,event_count:g.events.length,active:g.events.filter(e=>e.opportunity_status==="ACTIVE_OPPORTUNITY").length,plans:g.events.filter(e=>["PROCUREMENT_PLAN","UPCOMING_GPN"].includes(e.opportunity_status)).length,awards:g.events.filter(e=>e.opportunity_status==="AWARD_HISTORY").length,high:g.events.filter(e=>e.procurement_priority==="HIGH").length,value:g.events.reduce((s,e)=>s+num(e.estimated_value),0),latest:pubs.at(-1)||"",next:closes[0]||"",iati:g.events.filter(e=>e.matched_iati_identifier).length})}).sort((a,b)=>b.high-a.high||b.active-a.active||b.awards-a.awards||b.event_count-a.event_count||a.buyer.localeCompare(b.buyer));}
function render(){const q=document.getElementById("search").value.toLowerCase().trim(),country=document.getElementById("country").value;const filtered=aggregate(events).filter(g=>(!country||g.country===country)&&(!q||[g.buyer,g.country,[...g.categories].join(" "),[...g.sources].join(" ")].join(" ").toLowerCase().includes(q)));const all=aggregate(events);document.getElementById("metrics").innerHTML=`<div class="metric"><b>Buyers</b><strong>${all.length}</strong></div><div class="metric"><b>Active buyers</b><strong>${all.filter(g=>g.active).length}</strong></div><div class="metric"><b>Buyers with awards</b><strong>${all.filter(g=>g.awards).length}</strong></div><div class="metric"><b>High-priority buyers</b><strong>${all.filter(g=>g.high).length}</strong></div><div class="metric"><b>Estimated procurement</b><strong>${money(all.reduce((s,g)=>s+g.value,0))}</strong></div>`;document.getElementById("rows").innerHTML=filtered.map(g=>`<tr><td><div class="buyer">${esc(g.buyer)}</div><div class="sub">${esc([...g.sources].join("; "))}</div></td><td>${esc(g.country||"—")}</td><td class="num">${g.event_count}</td><td class="num">${g.active||"—"}</td><td>${g.plans||"—"}</td><td>${g.awards||"—"}</td><td class="num">${g.high||"—"}</td><td>${money(g.value)}</td><td>${esc(g.latest||"—")}</td><td>${esc(g.next||"—")}</td><td>${g.iati||"—"}</td><td>${esc([...g.categories].join("; ")||"—")}</td></tr>`).join("")||'<tr><td colspan="12" class="empty">No buyers match the current filters.</td></tr>'}
Papa.parse(DATA,{download:true,header:true,skipEmptyLines:true,complete:r=>{events=r.data||[];[...new Set(events.map(e=>e.country).filter(Boolean))].sort().forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;document.getElementById("country").appendChild(o)});render()}});["search","country"].forEach(id=>document.getElementById(id).addEventListener("input",render));
</script>
</body>
</html>
