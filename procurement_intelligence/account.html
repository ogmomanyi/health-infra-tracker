<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account Workspace</title><style>body{font:14px system-ui;margin:0;background:#f5f7fb;color:#172033}.shell{max-width:1450px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.links{display:flex;gap:14px}.links a,.opp-link{color:#2563eb}.panel{background:#fff;border:1px solid #d9e0ea;border-radius:8px;margin-top:16px}.controls{padding:14px}.controls input{width:100%;box-sizing:border-box;min-height:40px;border:1px solid #ccd5e1;border-radius:7px;padding:8px}.account{padding:16px;border-bottom:1px solid #e3e8ef}.account:last-child{border-bottom:0}.top{display:flex;justify-content:space-between;gap:12px}.name{font-size:18px;font-weight:750}.meta,.sub{color:#647084;font-size:12px}.stats{display:flex;gap:18px;margin-top:8px;flex-wrap:wrap}.stat b{display:block;font-size:18px;color:#172033}.stat span,.section-label{font-size:10px;text-transform:uppercase;color:#647084}.tag{display:inline-block;padding:3px 7px;border-radius:999px;border:1px solid #d9e0ea;font-size:10px;font-weight:750}.urgent{color:#be123c;background:#fff1f2;border-color:#fecdd3}.empty{padding:35px;text-align:center;color:#647084}.opp{margin-top:12px;padding:10px;background:#f7f9fc;border-radius:7px}.row{display:grid;grid-template-columns:1fr 120px 130px 130px;gap:10px;align-items:center}.affinity{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}.affinity th,.affinity td{text-align:left;padding:7px 8px;border-bottom:1px solid #e3e8ef;vertical-align:top}.affinity th{color:#647084;font-size:10px;text-transform:uppercase}.history{margin-top:15px}.signal{font-weight:700}@media(max-width:800px){header,.top{display:block}.links{margin-top:10px}.row{grid-template-columns:1fr 1fr}.affinity,.affinity tbody,.affinity tr,.affinity td{display:block}.affinity thead{display:none}.affinity tr{padding:9px 0;border-bottom:1px solid #e3e8ef}.affinity td{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;padding:5px 0;border:0;overflow-wrap:anywhere}.affinity td:before{content:attr(data-label);font-size:10px;font-weight:700;color:#647084;text-transform:uppercase}}</style></head><body><div class="shell"><header><div><h1>Account Workspace</h1><p>Account-level view of active opportunities, priority and manufacturer award history.</p><div id="status" class="meta">Connecting…</div></div><nav class="links"><a href="my-work.html">My Work</a><a href="execution.html">Execution Workspace</a><a href="../index.html">Commercial Intelligence</a></nav></header><div class="panel controls"><input id="search" placeholder="Search accounts, countries, manufacturers, opportunities…"></div><section id="accounts" class="panel"></section></div><script>const API=location.origin;let data=[];const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');const label=v=>String(v||'').replaceAll('_',' ');async function load(){try{const r=await fetch(API+'/api/accounts');if(!r.ok)throw Error('HTTP '+r.status);data=(await r.json()).accounts||[];document.getElementById('status').textContent=`${data.length} accounts represented`;render()}catch(e){document.getElementById('status').textContent='CRM unavailable: '+e.message}}function render(){const q=document.getElementById('search').value.toLowerCase().trim();const rows=data.filter(a=>!q||[a.account_name,a.country,a.account_type,...a.opportunities.map(o=>[o.title,o.buyer,o.equipment_category].join(' ')),...(a.manufacturer_relationships||[]).map(r=>[r.manufacturer_name,r.product_families,r.relationship_signal].join(' '))].join(' ').toLowerCase().includes(q));document.getElementById('accounts').innerHTML=rows.map(a=>{const relationships=a.manufacturer_relationships||[];const history=relationships.length?`<div class="history"><div class="section-label">Manufacturer procurement history</div><table class="affinity"><thead><tr><th>Manufacturer</th><th>Party role</th><th>Observed signal</th><th>Evidence</th></tr></thead><tbody>${relationships.map(r=>`<tr><td data-label="Manufacturer"><b>${esc(r.manufacturer_name||'—')}</b><div class="sub">${esc(r.product_families||'')}</div></td><td data-label="Party role">${esc(label(r.party_role))}</td><td data-label="Observed signal"><span class="signal">${esc(label(r.relationship_signal))}</span><div class="sub">${esc(r.relationship_confidence||'—')} confidence · ${esc(label(r.preference_status))}</div></td><td data-label="Evidence">${esc(r.procurement_event_count||'0')} event(s), ${esc(r.observed_award_count||'0')} award(s)<div class="sub">${esc(r.recommended_action||'')}</div></td></tr>`).join('')}</tbody></table></div>`:'';return `<article class="account"><div class="top"><div><div class="name">${esc(a.account_name||'Unknown account')}</div><div class="meta">${esc(a.country||'')} · ${esc(label(a.account_type||''))}</div></div><span class="tag">Highest: ${esc(a.highest_priority_tier||'—')}</span></div><div class="stats"><div class="stat"><b>${a.active_opportunities}</b><span>Active opportunities</span></div><div class="stat"><b>${esc(a.highest_priority_score??'—')}</b><span>Highest score</span></div><div class="stat"><b>${a.outstanding_actions}</b><span>Outstanding actions</span></div><div class="stat"><b>${relationships.length}</b><span>Manufacturer signals</span></div></div>${a.opportunities.map(o=>`<div class="opp"><div class="row"><div><a class="opp-link" href="opportunity.html?id=${encodeURIComponent(o.opportunity_id)}"><strong>${esc(o.title||'Account development')}</strong></a><div class="sub">${esc(o.opportunity_id)} · ${esc(o.buyer||'')}</div><div class="sub">Next: ${esc(o.effective_next_activity||'Review account action')} · due ${esc(o.due_date||'—')}</div></div><div>${esc(o.status)}</div><div>${esc(o.commercial_account_priority_tier)}<div class="sub">${esc(o.commercial_account_priority_score)}</div></div><div>${o.overdue?'<span class="tag urgent">OVERDUE</span>':esc(o.work_bucket||'later')}</div></div></div>`).join('')}${history}</article>`}).join('')||'<div class="empty">No accounts match the search.</div>'}document.getElementById('search').addEventListener('input',render);load()</script></body></html>
