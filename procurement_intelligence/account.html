<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account Workspace</title><style>body{font:14px system-ui;margin:0;background:#f5f7fb;color:#172033}.shell{max-width:1450px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.links{display:flex;gap:14px}.links a{color:#2563eb}.panel{background:#fff;border:1px solid #d9e0ea;border-radius:8px;margin-top:16px}.controls{padding:14px}.controls input{width:100%;box-sizing:border-box;min-height:40px;border:1px solid #ccd5e1;border-radius:7px;padding:8px}.account{padding:16px;border-bottom:1px solid #e3e8ef}.account:last-child{border-bottom:0}.top{display:flex;justify-content:space-between;gap:12px}.name{font-size:18px;font-weight:750}.meta,.sub{color:#647084;font-size:12px}.stats{display:flex;gap:18px;margin-top:8px;flex-wrap:wrap}.stat b{display:block;font-size:18px;color:#172033}.stat span{font-size:10px;text-transform:uppercase;color:#647084}.tag{display:inline-block;padding:3px 7px;border-radius:999px;border:1px solid #d9e0ea;font-size:10px;font-weight:750}.urgent{color:#be123c;background:#fff1f2;border-color:#fecdd3}.empty{padding:35px;text-align:center;color:#647084}.opp{margin-top:12px;padding:10px;background:#f7f9fc;border-radius:7px}.row{display:grid;grid-template-columns:1fr 120px 130px 130px;gap:10px;align-items:center}@media(max-width:800px){header,.top{display:block}.links{margin-top:10px}.row{grid-template-columns:1fr 1fr}}</style></head><body><div class="shell"><header><div><h1>Account Workspace</h1><p>Account-level view of active opportunities, priority and outstanding next actions.</p><div id="status" class="meta">Connecting…</div></div><nav class="links"><a href="my-work.html">My Work</a><a href="execution.html">Execution Workspace</a><a href="../index.html">Commercial Intelligence</a></nav></header><div class="panel controls"><input id="search" placeholder="Search accounts, countries, buyers, opportunities…"></div><section id="accounts" class="panel"></section></div><script>const API=location.origin;let data=[];const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');async function load(){try{const r=await fetch(API+'/api/accounts');if(!r.ok)throw Error('HTTP '+r.status);data=(await r.json()).accounts||[];document.getElementById('status').textContent=`${data.length} accounts represented`;render()}catch(e){document.getElementById('status').textContent='CRM unavailable: '+e.message}}function render(){const q=document.getElementById('search').value.toLowerCase().trim();const rows=data.filter(a=>!q||[a.account_name,a.country,a.account_type,...a.opportunities.map(o=>[o.title,o.buyer,o.equipment_category].join(' '))].join(' ').toLowerCase().includes(q));document.getElementById('accounts').innerHTML=rows.map(a=>`<article class="account"><div class="top"><div><div class="name">${esc(a.account_name||'Unknown account')}</div><div class="meta">${esc(a.country||'')} · ${esc(a.account_type||'')}</div></div><span class="tag">Highest: ${esc(a.highest_priority_tier||'—')}</span></div><div class="stats"><div class="stat"><b>${a.active_opportunities}</b><span>Active opportunities</span></div><div class="stat"><b>${esc(a.highest_priority_score??'—')}</b><span>Highest score</span></div><div class="stat"><b>${a.outstanding_actions}</b><span>Outstanding actions</span></div><div class="stat"><b>${a.overdue_actions}</b><span>Overdue</span></div></div>${a.opportunities.map(o=>`<div class="opp"><div class="row"><div><strong>${esc(o.title||'Account development')}</strong><div class="sub">${esc(o.opportunity_id)} · ${esc(o.buyer||'')}</div><div class="sub">Next: ${esc(o.effective_next_activity||'Review account action')} · due ${esc(o.due_date||'—')}</div></div><div>${esc(o.status)}</div><div>${esc(o.commercial_account_priority_tier)}<div class="sub">${esc(o.commercial_account_priority_score)}</div></div><div>${o.overdue?'<span class="tag urgent">OVERDUE</span>':esc(o.work_bucket||'later')}</div></div></div>`).join('')}</article>`).join('')||'<div class="empty">No accounts match the search.</div>'}document.getElementById('search').addEventListener('input',render);load()</script></body></html>
