<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Management Dashboard</title>
<style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fa;color:#172033}header{padding:24px 32px;background:#172033;color:white}nav a{color:#cfe0ff;margin-right:18px;text-decoration:none}.wrap{max-width:1400px;margin:24px auto;padding:0 20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card,.panel{background:white;border:1px solid #dfe4ec;border-radius:12px;padding:16px}.num{font-size:28px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.panel h2{margin-top:0;font-size:18px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #edf0f4;text-align:left;font-size:14px}.tag{display:inline-block;padding:3px 7px;border-radius:999px;background:#eef2f7}.empty{color:#697386}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head>
<body><header><h1>Management Dashboard</h1><nav><a href="execution.html">Execution</a><a href="my_work.html">My Work</a><a href="account.html">Accounts</a><a href="../index.html">Intelligence</a></nav></header>
<div class="wrap"><p id="status">Loading management view…</p><div class="cards" id="cards"></div><div class="grid"><section class="panel"><h2>Pipeline by stage</h2><div id="stage"></div></section><section class="panel"><h2>Work by owner</h2><div id="owner"></div></section><section class="panel"><h2>Overdue actions</h2><div id="overdue"></div></section><section class="panel"><h2>Closing within 7 days</h2><div id="closing"></div></section><section class="panel"><h2>High-priority unassigned</h2><div id="unassigned"></div></section><section class="panel"><h2>Estimated value by currency</h2><div id="value"></div></section></div></div>
<script>
const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const table=(headers,rows)=>rows.length?`<table><thead><tr>${headers.map(esc).map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`:'<p class="empty">None</p>';
async function load(){try{const r=await fetch('/api/management');if(!r.ok)throw new Error('API unavailable');const d=await r.json();
 document.getElementById('status').textContent=`CRM connected · as of ${d.as_of}`;
 const s=d.summary; document.getElementById('cards').innerHTML=[['Active opportunities',s.active_opportunities],['Accounts',s.accounts],['Overdue actions',s.overdue_actions],['Closing soon',s.closing_soon],['Won',s.won],['Lost',s.lost],['High-priority unassigned',s.high_priority_unassigned]].map(x=>`<div class="card"><div>${esc(x[0])}</div><div class="num">${esc(x[1])}</div></div>`).join('');
 document.getElementById('stage').innerHTML=table(['Stage','Count'],d.pipeline_by_stage.map(x=>`<tr><td><span class="tag">${esc(x.stage)}</span></td><td>${esc(x.count)}</td></tr>`));
 document.getElementById('owner').innerHTML=table(['Owner','Active work'],d.work_by_owner.map(x=>`<tr><td>${esc(x.owner)}</td><td>${esc(x.count)}</td></tr>`));
 const row=x=>`<tr><td>${esc(x.account_name)}</td><td>${esc(x.title)}</td><td>${esc(x.assigned_owner||'Unassigned')}</td><td>${esc(x.commercial_account_priority_score)}</td></tr>`;
 document.getElementById('overdue').innerHTML=table(['Account','Opportunity','Owner','Priority'],d.overdue.map(row));
 document.getElementById('closing').innerHTML=table(['Account','Opportunity','Closing','Days'],d.closing_soon.map(x=>`<tr><td>${esc(x.account_name)}</td><td>${esc(x.title)}</td><td>${esc(x.closing_date)}</td><td>${esc(x.days_to_closing)}</td></tr>`));
 document.getElementById('unassigned').innerHTML=table(['Account','Opportunity','Score','Tier'],d.high_priority_unassigned.map(x=>`<tr><td>${esc(x.account_name)}</td><td>${esc(x.title)}</td><td>${esc(x.commercial_account_priority_score)}</td><td>${esc(x.commercial_account_priority_tier)}</td></tr>`));
 document.getElementById('value').innerHTML=table(['Currency','Estimated value'],d.estimated_value_by_currency.map(x=>`<tr><td>${esc(x.currency)}</td><td>${esc(Number(x.value).toLocaleString())}</td></tr>`));
 }catch(e){document.getElementById('status').textContent='CRM API unavailable. Start: python commercial_crm_server.py';}}
load();
</script></body></html>
