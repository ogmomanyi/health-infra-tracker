<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>External Procurement Intelligence</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#647084;--line:#d9e0ea;--teal:#0f766e;--blue:#2563eb;--amber:#b45309;--rose:#be123c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}.shell{max-width:1600px;margin:auto;padding:24px}.header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}.header h1{margin:0;font-size:24px}.header p{margin:5px 0 0;color:var(--muted)}.links{display:flex;gap:14px}.link{color:var(--blue);text-decoration:none}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}.metric,.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 20px rgba(23,32,51,.05)}.metric{padding:15px}.metric b{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}.metric strong{display:block;font-size:27px;margin-top:9px}.controls{padding:12px;margin-bottom:16px;display:grid;grid-template-columns:1.5fr repeat(4,1fr);gap:10px}.controls label{display:block;color:var(--muted);font-size:11px;font-weight:700;margin-bottom:5px}.controls input,.controls select{width:100%;min-height:38px;border:1px solid var(--line);border-radius:7px;padding:8px;background:#fbfdff;color:var(--ink)}.table-wrap{overflow:auto;max-height:680px}.panel{overflow:hidden}table{width:100%;min-width:1450px;border-collapse:collapse}th{position:sticky;top:0;background:#f3f6fa;color:var(--muted);font-size:11px;text-align:left;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--line);z-index:1}td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}.title{font-weight:750}.sub{color:var(--muted);font-size:12px;margin-top:3px}.tag{display:inline-block;padding:3px 7px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--line)}.active{color:var(--teal);background:#f0fdfa;border-color:#99f6e4}.high{color:var(--rose);background:#fff1f2;border-color:#fecdd3}.medium{color:var(--amber);background:#fffbeb;border-color:#fde68a}.award{color:var(--muted);background:#f3f6fa}.match-confirmed{color:var(--teal);background:#f0fdfa;border-color:#99f6e4}.match-possible{color:var(--amber);background:#fffbeb;border-color:#fde68a}.match-unmatched{color:var(--rose);background:#fff1f2;border-color:#fecdd3}.score{font-weight:800}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:1000px){.metrics{grid-template-columns:repeat(3,1fr)}.controls{grid-template-columns:1fr 1fr}}@media(max-width:600px){.metrics{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr}.shell{padding:14px}}
</style>
</head>
<body>
<div class="shell">
<header class="header"><div><h1>External Procurement Intelligence</h1><p>Published procurement signals enriched for opportunity status, Faram relevance and IATI linkage.</p></div><nav class="links"><a class="link" href="buyers.html">Buyer Intelligence →</a><a class="link" href="suppliers.html">Supplier Intelligence →</a><a class="link" href="../index.html">← Commercial Intelligence</a></nav></header>
<section class="metrics" id="metrics"></section>
<section class="panel controls">
<div><label>Search</label><input id="search" placeholder="Tender, buyer, product, reference…"></div>
<div><label>Source</label><select id="source"><option value="">All sources</option></select></div>
<div><label>Country</label><select id="country"><option value="">All countries</option></select></div>
<div><label>Opportunity</label><select id="opportunity"><option value="">All opportunity types</option><option>ACTIVE_OPPORTUNITY</option><option>UPCOMING_GPN</option><option>PROCUREMENT_PLAN</option><option>AWARD_HISTORY</option><option>CLOSED_OPPORTUNITY</option><option>NOTICE</option><option>UNKNOWN</option></select></div>
<div><label>Priority</label><select id="priority"><option value="">All priorities</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option><option>MONITOR</option></select></div>
</section>
<section class="panel table-wrap"><table><thead><tr><th>Source</th><th>Tender</th><th>Buyer</th><th>Country</th><th>Opportunity</th><th>Priority</th><th>Faram fit</th><th>Category</th><th>Closing</th><th>Project</th><th>IATI</th><th>Match</th></tr></thead><tbody id="rows"></tbody></table></section>
</div>
<script>
const DATA="../data/procurement_events.csv";let events=[];const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;");const daysToClose=e=>{if(!e.closing_date)return Infinity;return(new Date(e.closing_date)-new Date())/86400000};const tag=(text,cls)=>`<span class="tag ${cls}">${esc(text)}</span>`;function populate(id,values){const el=document.getElementById(id);[...new Set(values.filter(Boolean).map(String))].sort().forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;el.appendChild(o)})}function render(){const q=document.getElementById("search").value.toLowerCase().trim(),source=document.getElementById("source").value,country=document.getElementById("country").value,opportunity=document.getElementById("opportunity").value,priority=document.getElementById("priority").value;const filtered=events.filter(e=>{const hay=[e.title,e.tender_reference,e.buyer,e.country,e.product_family,e.equipment_category,e.project_reference,e.faram_relevance_reason].join(" ").toLowerCase();return(!q||hay.includes(q))&&(!source||e.source===source)&&(!country||e.country===country)&&(!opportunity||e.opportunity_status===opportunity)&&(!priority||e.procurement_priority===priority)});const active=events.filter(e=>e.opportunity_status==="ACTIVE_OPPORTUNITY").length,high=events.filter(e=>e.procurement_priority==="HIGH").length,awards=events.filter(e=>e.opportunity_status==="AWARD_HISTORY").length,soon=events.filter(e=>{const d=daysToClose(e);return e.opportunity_status==="ACTIVE_OPPORTUNITY"&&d>=0&&d<=7}).length;document.getElementById("metrics").innerHTML=`<div class="metric"><b>Published events</b><strong>${events.length}</strong></div><div class="metric"><b>Active opportunities</b><strong>${active}</strong></div><div class="metric"><b>High Faram relevance</b><strong>${high}</strong></div><div class="metric"><b>Awards / history</b><strong>${awards}</strong></div><div class="metric"><b>Active closing ≤7 days</b><strong>${soon}</strong></div>`;document.getElementById("rows").innerHTML=filtered.sort((a,b)=>{const p={HIGH:0,MEDIUM:1,LOW:2,MONITOR:3};return(p[a.procurement_priority]??9)-(p[b.procurement_priority]??9)||daysToClose(a)-daysToClose(b)}).map(e=>{const match=(e.match_status||"UNMATCHED").toUpperCase();const opportunityClass=e.opportunity_status==="ACTIVE_OPPORTUNITY"?"active":e.opportunity_status==="AWARD_HISTORY"?"award":"";const priorityClass=(e.procurement_priority||"MONITOR").toLowerCase();const matchClass=`match-${match.toLowerCase()}`;return `<tr><td>${esc(e.source)}</td><td><div class="title">${esc(e.title)}</div><div class="sub">${esc(e.tender_reference)}</div></td><td>${esc(e.buyer||"—")}</td><td>${esc(e.country||"—")}</td><td>${tag(e.opportunity_status||"UNKNOWN",opportunityClass)}</td><td>${tag(e.procurement_priority||"MONITOR",priorityClass)}</td><td><span class="score">${esc(e.faram_relevance_score||0)}/100</span><div class="sub">${esc(e.faram_relevance_reason||"")}</div></td><td>${esc(e.equipment_category||"—")}</td><td>${esc(e.closing_date||"—")}</td><td>${esc(e.project_reference||"—")}</td><td>${esc(e.matched_iati_identifier||"—")}</td><td>${tag(match,matchClass)}</td></tr>`}).join("")||'<tr><td colspan="12" class="empty">No procurement events match the current filters.</td></tr>'}Papa.parse(DATA,{download:true,header:true,skipEmptyLines:true,complete:r=>{events=r.data||[];populate("source",events.map(e=>e.source));populate("country",events.map(e=>e.country));render()}});["search","source","country","opportunity","priority"].forEach(id=>document.getElementById(id).addEventListener("input",render));
</script>
</body>
</html>
