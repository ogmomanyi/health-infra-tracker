<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Work</title>
<style>
:root{--bg:#f5f7fa;--panel:#fff;--ink:#172033;--muted:#647084;--line:#d8e0ea;--soft:#f1f5f9;--blue:#1d4ed8;--rose:#be123c;--amber:#a16207;--green:#15803d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}.shell{max-width:1480px;margin:auto;padding:20px}.header{display:flex;justify-content:space-between;align-items:end;gap:18px;padding-bottom:16px;border-bottom:1px solid var(--line)}h1{font-size:24px;margin:0}.subtitle{color:var(--muted);margin:5px 0 0}.nav{display:flex;gap:14px;flex-wrap:wrap}.nav a{color:var(--blue);font-weight:650;text-decoration:none}.metrics{display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border:1px solid var(--line);margin:16px 0}.metric{padding:13px 16px;border-right:1px solid var(--line)}.metric:last-child{border-right:0}.metric b{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}.metric strong{display:block;font-size:24px;margin-top:5px}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:14px}.field label{display:block;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;margin-bottom:5px}.field input{min-height:38px;border:1px solid var(--line);border-radius:6px;padding:8px 9px;background:#fff}.segments{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}.segment{border:0;border-right:1px solid var(--line);background:#fff;padding:9px 12px;cursor:pointer;font-weight:750}.segment:last-child{border-right:0}.segment.active{background:#dbeafe;color:#1e40af}.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}.panel-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.panel-head h2{font-size:15px;margin:0}.meta,.sub{color:var(--muted);font-size:11px}.table-wrap{overflow:auto}table{width:100%;min-width:1040px;border-collapse:collapse}th{background:var(--soft);color:var(--muted);text-align:left;text-transform:uppercase;font-size:10px;padding:10px;border-bottom:1px solid var(--line)}td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}.title{font-weight:750}.tag{display:inline-block;padding:3px 7px;border:1px solid var(--line);border-radius:999px;font-size:10px;font-weight:800}.overdue{color:var(--rose);background:#fff1f2;border-color:#fecdd3}.today{color:var(--amber);background:#fffbeb;border-color:#fde68a}.week{color:var(--blue);background:#eff6ff;border-color:#bfdbfe}.later{color:var(--muted);background:var(--soft)}.btn{display:inline-block;border:1px solid var(--blue);background:var(--blue);color:#fff;text-decoration:none;border-radius:6px;padding:8px 10px;font-weight:750}.empty{padding:36px;text-align:center;color:var(--muted)}@media(max-width:850px){.metrics{grid-template-columns:1fr 1fr}.metric{border-bottom:1px solid var(--line)}.toolbar,.header{align-items:start;flex-direction:column}}@media(max-width:520px){.shell{padding:12px}.segments{width:100%;overflow:auto}.segment{flex:1}.metrics{grid-template-columns:1fr 1fr}.metric{padding:11px}}
</style></head><body><div class="shell"><header class="header"><div><h1>My Work</h1><p class="subtitle">The projects and opportunities that need a next action.</p></div><nav class="nav"><a href="/projects">Projects</a><a href="/">Execution</a><a href="/accounts">Accounts</a><a href="/management">Management</a><a href="/intelligence">Intelligence</a></nav></header><section class="metrics"><div class="metric"><b>Active</b><strong id="active">0</strong></div><div class="metric"><b>Overdue</b><strong id="overdue">0</strong></div><div class="metric"><b>Due today</b><strong id="today">0</strong></div><div class="metric"><b>This week</b><strong id="week">0</strong></div><div class="metric"><b>Unassigned</b><strong id="unassigned">0</strong></div></section><div class="toolbar"><div class="segments" id="segments"><button class="segment active" data-bucket="">All</button><button class="segment" data-bucket="overdue">Overdue</button><button class="segment" data-bucket="today">Today</button><button class="segment" data-bucket="week">This week</button><button class="segment" data-bucket="later">Later</button></div><div class="field"><label>Owner</label><input id="owner" placeholder="Filter by exact owner"></div></div><section class="panel"><div class="panel-head"><h2 id="listTitle">All active work</h2><span class="meta" id="meta">Loading…</span></div><div class="table-wrap"><table><thead><tr><th>Due</th><th>Next action</th><th>Project / opportunity</th><th>Account</th><th>Owner</th><th>Priority</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></div><script>
const esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');let items=[],bucket='',timer;async function api(path){const r=await fetch(path);const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||`HTTP ${r.status}`);return b}function render(){const rows=bucket?items.filter(i=>i.work_bucket===bucket):items;document.getElementById('meta').textContent=`${rows.length} item${rows.length===1?'':'s'}`;document.getElementById('listTitle').textContent=bucket?`${bucket==='week'?'This week':bucket[0].toUpperCase()+bucket.slice(1)} work`:'All active work';document.getElementById('rows').innerHTML=rows.map(i=>`<tr><td><span class="tag ${esc(i.work_bucket)}">${esc(i.due_date||'No date')}</span></td><td><div class="title">${esc(i.effective_next_activity||'Review account action')}</div><div class="sub">${esc(i.status||'OPEN')}</div></td><td><div class="title">${esc(i.title||i.tender_reference||i.opportunity_id)}</div><div class="sub">${esc(i.tender_reference||i.opportunity_id)}</div></td><td>${esc(i.account_name||'—')}<div class="sub">${esc(i.country||'')}</div></td><td>${esc(i.assigned_owner||'Unassigned')}</td><td><b>${esc(i.commercial_account_priority_score??'—')}</b><div class="sub">${esc(i.commercial_account_priority_tier||'')}</div></td><td><a class="btn" href="/opportunity.html?id=${encodeURIComponent(i.opportunity_id)}">Open</a></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No work is in this view.</td></tr>'}async function load(){try{const owner=document.getElementById('owner').value.trim(),payload=await api(`/api/work${owner?`?owner=${encodeURIComponent(owner)}`:''}`);items=payload.items;Object.entries(payload.summary).forEach(([key,value])=>{const el=document.getElementById(key);if(el)el.textContent=value});render()}catch(error){document.getElementById('rows').innerHTML=`<tr><td colspan="7" class="empty">Could not load work: ${esc(error.message)}</td></tr>`}}document.querySelectorAll('.segment').forEach(button=>button.onclick=()=>{bucket=button.dataset.bucket;document.querySelectorAll('.segment').forEach(item=>item.classList.toggle('active',item===button));render()});document.getElementById('owner').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(load,250)});load();
</script></body></html>
