<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supplier Competitive Intelligence</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--ink:#172033;--muted:#647084;--line:#d9e0ea;--blue:#2563eb;--teal:#0f766e;--amber:#b45309}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,system-ui,sans-serif}.shell{max-width:1700px;margin:auto;padding:24px}.header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:18px}.header h1{margin:0;font-size:24px}.header p{margin:5px 0 0;color:var(--muted)}.links{display:flex;gap:14px}.link{color:var(--blue);text-decoration:none}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}.metric,.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 20px rgba(23,32,51,.05)}.metric{padding:15px}.metric b{display:block;color:var(--muted);font-size:11px;text-transform:uppercase}.metric strong{display:block;font-size:27px;margin-top:9px}.controls{padding:12px;margin-bottom:16px}.controls label{display:block;color:var(--muted);font-size:11px;font-weight:700;margin-bottom:5px}.controls input{width:100%;min-height:38px;border:1px solid var(--line);border-radius:7px;padding:8px;background:#fbfdff;color:var(--ink)}.table-wrap{overflow:auto;max-height:720px}.panel{overflow:hidden}table{width:100%;min-width:1450px;border-collapse:collapse}th{position:sticky;top:0;background:#f3f6fa;color:var(--muted);font-size:11px;text-align:left;text-transform:uppercase;padding:10px 12px;border-bottom:1px solid var(--line);z-index:1}td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}.supplier{font-weight:750}.sub{color:var(--muted);font-size:12px;margin-top:3px}.num{font-weight:800}.tag{display:inline-block;padding:3px 7px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid var(--line)}.inc{color:var(--teal);background:#f0fdfa;border-color:#99f6e4}.rep{color:var(--amber);background:#fffbeb;border-color:#fde68a}.known{color:var(--muted);background:#f3f6fa}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:1000px){.metrics{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.metrics{grid-template-columns:1fr 1fr}.shell{padding:14px}}
</style></head><body><div class="shell">
<header class="header"><div><h1>Supplier Competitive Intelligence</h1><p>Explicit procurement award evidence only — no inferred incumbents.</p></div><nav class="links"><a class="link" href="dashboard.html">External Procurement</a><a class="link" href="buyers.html">Buyer Intelligence</a><a class="link" href="../index.html">Commercial Intelligence</a></nav></header>
<section class="metrics" id="metrics"></section><section class="panel controls"><label>Search supplier, buyer, country, category or project</label><input id="search" placeholder="e.g. supplier, laboratory, Kenya…"></section><section class="panel table-wrap"><table><thead><tr><th>Supplier</th><th>Country</th><th>Awards</th><th>Position</th><th>Buyers</th><th>Categories</th><th>Projects</th><th>Latest Award</th><th>Award Value</th><th>Currencies</th><th>Faram Relevant</th><th>High Priority</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></section></div>
<script>const DATA="../data/procurement_supplier_history.csv";let suppliers=[];const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;");const num=v=>Number(v||0);const tag=(text,cls)=>`<span class="tag ${cls}">${esc(text)}</span>`;function render(){const q=document.getElementById("search").value.toLowerCase().trim();const filtered=suppliers.filter(s=>[s.supplier,s.supplier_country,s.buyers,s.categories,s.projects,s.recommended_action].join(" ").toLowerCase().includes(q));document.getElementById("metrics").innerHTML=`<div class="metric"><b>Known suppliers</b><strong>${suppliers.length}</strong></div><div class="metric"><b>Incumbent patterns</b><strong>${suppliers.filter(s=>s.competitive_position==="INCUMBENT_PATTERN").length}</strong></div><div class="metric"><b>Repeat suppliers</b><strong>${suppliers.filter(s=>s.competitive_position==="REPEAT_SUPPLIER").length}</strong></div><div class="metric"><b>Faram-relevant awards</b><strong>${suppliers.reduce((n,s)=>n+num(s.faram_relevant_awards),0)}</strong></div><div class="metric"><b>High-priority awards</b><strong>${suppliers.reduce((n,s)=>n+num(s.faram_high_priority_awards),0)}</strong></div>`;document.getElementById("rows").innerHTML=filtered.map(s=>`<tr><td><div class="supplier">${esc(s.supplier)}</div><div class="sub">${esc(s.supplier_evidence_status)}</div></td><td>${esc(s.supplier_country||"—")}</td><td class="num">${esc(s.award_count)}</td><td>${tag(s.competitive_position,(s.competitive_position||"").slice(0,3).toLowerCase())}</td><td>${esc(s.buyers||"—")}</td><td>${esc(s.categories||"—")}</td><td>${esc(s.projects||"—")}</td><td>${esc(s.latest_award_date||"—")}</td><td>${esc(s.award_value_total||"—")}</td><td>${esc(s.award_currencies||"—")}</td><td>${esc(s.faram_relevant_awards||"—")}</td><td>${esc(s.faram_high_priority_awards||"—")}</td><td>${esc(s.recommended_action||"Monitor")}</td></tr>`).join("")||'<tr><td colspan="13" class="empty">No suppliers match the current search.</td></tr>'}Papa.parse(DATA,{download:true,header:true,skipEmptyLines:true,complete:r=>{suppliers=r.data||[];render()},error:()=>{document.getElementById("rows").innerHTML='<tr><td colspan="13" class="empty">Supplier history has not been generated yet. Run the procurement refresh pipeline.</td></tr>'}});document.getElementById("search").addEventListener("input",render);</script>
</body></html>
