<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Dashboard</title>
    
    <!-- CDNs for Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-100 p-8 text-gray-800">

    <div x-data="dashboardData()" x-init="initDashboard()" class="max-w-7xl mx-auto">
        
        <!-- Header & Search (Debounced) -->
        <div class="mb-8 flex flex-col md:flex-row md:justify-between md:items-center gap-4">
            <h1 class="text-3xl font-bold">Project Dashboard</h1>
            <input 
                type="text" 
                x-model.debounce.300ms="searchQuery" 
                placeholder="Search projects by ID or Title..." 
                class="px-4 py-2 border border-gray-300 rounded shadow-sm w-full md:w-80 focus:outline-none focus:ring-2 focus:ring-blue-500"
            >
        </div>

        <!-- Loading State -->
        <div x-show="loading" class="text-center py-20 text-gray-500">
            <svg class="animate-spin h-8 w-8 mx-auto mb-4 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            Loading dashboard data...
        </div>

        <!-- Error & File Upload State -->
        <div x-show="error" style="display: none;" class="bg-white border-l-4 border-red-500 p-6 rounded shadow mb-6">
            <h3 class="text-lg font-bold text-red-700 mb-2">Data Source Not Found</h3>
            <p class="text-gray-600 mb-4" x-text="errorMessage"></p>
            
            <div class="border-t border-gray-200 pt-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Upload your CSV file manually:</label>
                <input 
                    type="file" 
                    @change="handleFileUpload" 
                    accept=".csv" 
                    class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
                >
            </div>
        </div>

        <!-- Main Dashboard Content -->
        <div x-show="!loading && !error" style="display: none;" class="space-y-6">
            
            <!-- Metrics Cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-lg shadow border border-gray-100">
                    <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-2">Total Budget</h2>
                    <p class="text-3xl font-bold text-gray-800">$<span x-text="formatCurrency(metrics.totalBudget)"></span></p>
                </div>
                <div class="bg-white p-6 rounded-lg shadow border border-gray-100">
                    <h2 class="text-sm font-bold text-gray-400 uppercase tracking-wider mb-2">Projects Found</h2>
                    <p class="text-3xl font-bold text-gray-800" x-text="metrics.projectCount"></p>
                </div>
            </div>

            <!-- Chart Section -->
            <div class="bg-white p-6 rounded-lg shadow border border-gray-100 h-[400px]">
                <canvas id="budgetChart"></canvas>
            </div>

            <!-- Data Table with Pagination -->
            <div class="bg-white rounded-lg shadow border border-gray-100 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b border-gray-200 text-sm uppercase tracking-wider text-gray-500">
                                <th class="px-6 py-4 font-medium">IATI Identifier</th>
                                <th class="px-6 py-4 font-medium">Title</th>
                                <th class="px-6 py-4 font-medium text-right">Budget Amount</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200">
                            <!-- Loop specifically through paginatedProjects, NOT filteredProjects -->
                            <template x-for="proj in paginatedProjects" :key="proj.iati_identifier">
                                <tr class="hover:bg-blue-50 transition-colors">
                                    <td class="px-6 py-4 text-sm font-mono text-gray-600" x-text="proj.iati_identifier"></td>
                                    <td class="px-6 py-4 text-sm text-gray-800" x-text="proj.title"></td>
                                    <td class="px-6 py-4 text-sm font-medium text-gray-800 text-right">$<span x-text="formatCurrency(proj.total_budget_amount)"></span></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
                
                <!-- Pagination Controls -->
                <div class="bg-gray-50 px-6 py-4 border-t border-gray-200 flex items-center justify-between">
                    <span class="text-sm text-gray-600">
                        Showing page <span class="font-semibold text-gray-900" x-text="currentPage"></span> of <span class="font-semibold text-gray-900" x-text="totalPages"></span>
                    </span>
                    <div class="space-x-2">
                        <button 
                            @click="currentPage--" 
                            :disabled="currentPage === 1" 
                            class="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded text-sm hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                            Previous
                        </button>
                        <button 
                            @click="currentPage++" 
                            :disabled="currentPage === totalPages || totalPages === 0" 
                            class="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded text-sm hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed">
                            Next
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Application Logic -->
    <script>
        function dashboardData() {
            return {
                // State variables
                loading: true,
                error: false,
                errorMessage: '',
                searchQuery: '',
                
                // Data arrays
                projects: [],
                filteredProjects: [],
                
                // Pagination state
                currentPage: 1,
                pageSize: 10,
                
                // Metrics & Chart objects
                metrics: { totalBudget: 0, projectCount: 0 },
                chartInstance: null,

                initDashboard() {
                    // Watch for search query changes and reset pagination
                    this.$watch('searchQuery', () => {
                        this.currentPage = 1; 
                        this.resetAndRender();
                    });
                    
                    // Attempt to fetch data on load
                    this.fetchData();
                },

                fetchData() {
                    // Look for a local data.csv. If it fails, fallback to manual upload UI.
                    fetch('data.csv')
                        .then(response => {
                            if (!response.ok) throw new Error("Local data.csv not found.");
                            return response.text();
                        })
                        .then(csvText => this.parseData(csvText))
                        .catch(err => {
                            this.loading = false;
                            this.error = true;
                            this.errorMessage = "Could not automatically load data.csv. Please upload a file manually.";
                        });
                },

                handleFileUpload(event) {
                    const file = event.target.files[0];
                    if (!file) return;

                    this.loading = true;
                    this.error = false;

                    const reader = new FileReader();
                    reader.onload = (e) => {
                        this.parseData(e.target.result);
                    };
                    reader.onerror = () => {
                        this.errorMessage = "Failed to read the uploaded file.";
                        this.error = true;
                        this.loading = false;
                    };
                    reader.readAsText(file);
                },

                parseData(csvString) {
                    // PapaParse handles edge cases like commas inside quotes automatically
                    Papa.parse(csvString, {
                        header: true,
                        skipEmptyLines: true,
                        complete: (results) => {
                            this.projects = results.data.map(item => ({
                                iati_identifier: item.iati_identifier || 'Unknown ID',
                                title: item.title || 'Untitled',
                                // Fallback mapping in case headers differ slightly
                                total_budget_amount: parseFloat(item.total_budget_amount || item.budget || 0)
                            }));
                            this.loading = false;
                            this.error = false;
                            this.resetAndRender();
                        },
                        error: (err) => {
                            this.errorMessage = "Failed to parse the CSV formatting.";
                            this.error = true;
                            this.loading = false;
                        }
                    });
                },

                resetAndRender() {
                    const query = this.searchQuery.toLowerCase();
                    
                    // Filter based on query
                    this.filteredProjects = this.projects.filter(p => 
                        p.title.toLowerCase().includes(query) || 
                        p.iati_identifier.toLowerCase().includes(query)
                    );

                    // Calculate Summary Metrics
                    this.metrics.projectCount = this.filteredProjects.length;
                    this.metrics.totalBudget = this.filteredProjects.reduce((sum, p) => sum + (p.total_budget_amount || 0), 0);

                    // Wait for the DOM to update before drawing the chart
                    this.$nextTick(() => {
                        this.renderChart();
                    });
                },

                renderChart() {
                    const ctx = document.getElementById('budgetChart');
                    if (!ctx) return;

                    // Destroy old chart instance to prevent hover/flicker glitches
                    if (this.chartInstance) {
                        this.chartInstance.destroy();
                    }

                    // For the chart, we'll graph the top 10 largest budgets to keep it readable
                    const sortedForChart = [...this.filteredProjects]
                        .sort((a, b) => b.total_budget_amount - a.total_budget_amount)
                        .slice(0, 10);

                    const labels = sortedForChart.map(p => p.iati_identifier);
                    const data = sortedForChart.map(p => p.total_budget_amount);

                    this.chartInstance = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels.length ? labels : ['No Data'],
                            datasets: [{
                                label: 'Top 10 Project Budgets',
                                data: data.length ? data : [0],
                                backgroundColor: 'rgba(59, 130, 246, 0.7)',
                                borderRadius: 4,
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false }
                            },
                            scales: {
                                y: { 
                                    beginAtZero: true,
                                    grid: { color: '#f3f4f6' }
                                },
                                x: {
                                    grid: { display: false }
                                }
                            }
                        }
                    });
                },

                formatCurrency(value) {
                    const num = parseFloat(value);
                    if (isNaN(num)) return '0';
                    return new Intl.NumberFormat('en-US', { 
                        maximumFractionDigits: 0 
                    }).format(num);
                },

                // Pagination Getters
                get paginatedProjects() {
                    const start = (this.currentPage - 1) * this.pageSize;
                    return this.filteredProjects.slice(start, start + this.pageSize);
                },

                get totalPages() {
                    return Math.max(1, Math.ceil(this.filteredProjects.length / this.pageSize));
                }
            }
        }
    </script>
</body>
</html>
