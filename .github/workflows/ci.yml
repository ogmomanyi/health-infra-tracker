name: Python CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "integration/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run unit tests
        run: python -m pytest -q

      - name: Validate 03D canonical entity model
        run: python validate_03d_entity_model.py

      - name: Validate 03D canonical-root references
        run: python validate_03d_canonical_references.py
