name: External Procurement Intelligence

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh external procurement sources
        env:
          AFDB_PROCUREMENT_FEED_URL: ${{ vars.AFDB_PROCUREMENT_FEED_URL }}
          UNDP_PROCUREMENT_URL: ${{ vars.UNDP_PROCUREMENT_URL }}
        run: |
          args=(
            --source all
            --country KE
            --country UG
            --country RW
            --country ET
            --country SO
            --country SS
            --country CD
          )

          if [ -n "$AFDB_PROCUREMENT_FEED_URL" ]; then
            args+=(--afdb-feed-url "$AFDB_PROCUREMENT_FEED_URL")
          else
            args+=(--afdb-page-url "https://www.afdb.org/en/documents/project-related-procurement/procurement-notices/specific-procurement-notices")
            args+=(--afdb-page-url "https://www.afdb.org/en/documents/project-related-procurement/procurement-notices/general-procurement-notices")
            args+=(--afdb-page-url "https://www.afdb.org/en/documents/project-related-procurement/procurement-notices/invitation-bids")
          fi

          if [ -n "$UNDP_PROCUREMENT_URL" ]; then
            args+=(--undp-url "$UNDP_PROCUREMENT_URL")
          fi

          python -m procurement_intelligence.run "${args[@]}"

      - name: Integrate external procurement dashboard tab
        run: python scripts/integrate_external_procurement.py

      - name: Commit refreshed procurement data and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve generated outputs, fast-forward to the latest main, then commit
          # the refresh on top so a long-running collection cannot lose intervening work.
          cp data/procurement_events.csv /tmp/procurement_events.csv
          cp data/iati_intelligence.db /tmp/iati_intelligence.db
          cp index.html /tmp/index.html
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/procurement_events.csv data/procurement_events.csv
          cp /tmp/iati_intelligence.db data/iati_intelligence.db
          cp /tmp/index.html index.html
          git add data/procurement_events.csv data/iati_intelligence.db index.html
          git diff --cached --quiet || git commit -m "Automated external procurement refresh and dashboard integration"
          git push
