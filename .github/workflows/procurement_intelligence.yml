name: External Procurement Intelligence

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: external-procurement-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh external procurement sources
        env:
          AFDB_PROCUREMENT_FEED_URL: ${{ vars.AFDB_PROCUREMENT_FEED_URL }}
          UNDP_PROCUREMENT_URL: ${{ vars.UNDP_PROCUREMENT_URL }}
        run: |
          args=(--source all --country KE --country UG --country RW --country ET --country SO --country SS --country CD)
          if [ -n "$AFDB_PROCUREMENT_FEED_URL" ]; then args+=(--afdb-feed-url "$AFDB_PROCUREMENT_FEED_URL"); else args+=(--afdb-page-url "https://www.afdb.org/en/documents/project-related-procurement/procurement-notices/specific-procurement-notices" --afdb-page-url "https://www.afdb.org/en/documents/project-related-procurement/procurement-notices/general-procurement-notices" --afdb-page-url "https://www.afdb.org/en/documents/project-related-procurement/procurement-notices/invitation-bids"); fi
          if [ -n "$UNDP_PROCUREMENT_URL" ]; then args+=(--undp-url "$UNDP_PROCUREMENT_URL"); fi
          python -m procurement_intelligence.run "${args[@]}"

      - name: Build buyer demand intelligence
        run: python -m procurement_intelligence.buyer_intelligence --events data/procurement_events.csv --database data/iati_intelligence.db --output data/procurement_buyer_history.csv

      - name: Match procurement products and manufacturers
        run: python -m procurement_intelligence.product_matching --events data/procurement_events.csv --equipment-entities data/equipment_entities.csv --manufacturer-entities data/manufacturer_entities.csv --output data/procurement_product_matches.csv

      - name: Match procurement demand against Faram catalogue
        run: python -m procurement_intelligence.faram_product_matching --procurement-matches data/procurement_product_matches.csv --catalogue data/faram_product_catalogue.csv --output data/faram_product_matches.csv

      - name: Build historical Faram quote intelligence
        run: python -m procurement_intelligence.historical_quote_intelligence --evidence data/faram_historical_quote_evidence.csv --output data/faram_historical_quote_summary.csv

      - name: Build Faram commercial memory
        run: python -m procurement_intelligence.commercial_memory --evidence data/faram_historical_quote_evidence.csv --enrichment data/faram_commercial_memory_enrichment.csv --catalogue data/faram_product_catalogue.csv --output data/faram_commercial_memory.csv --summary data/faram_commercial_memory_summary.csv

      - name: Build account commercial memory
        run: python -m procurement_intelligence.account_commercial_memory --accounts data/target_accounts.csv --evidence data/faram_historical_quote_evidence.csv --catalogue data/faram_product_catalogue.csv --output data/faram_account_commercial_memory.csv

      - name: Build commercial account priority
        run: python -m procurement_intelligence.commercial_account_priority --accounts data/target_accounts.csv --buyers data/procurement_buyer_history.csv --events data/procurement_events.csv --catalogue-matches data/faram_product_matches.csv --memory data/faram_account_commercial_memory.csv --output data/commercial_account_priority.csv

      - name: Build commercial action queue
        run: python -m procurement_intelligence.commercial_action_queue --priority data/commercial_account_priority.csv --output data/commercial_action_queue.csv

      - name: Build commercial opportunity workspace
        run: python -m procurement_intelligence.commercial_opportunity_workspace --actions data/commercial_action_queue.csv --events data/procurement_events.csv --output data/commercial_opportunity_workspace.csv

      - name: Validate tender predictions
        run: python -m procurement_intelligence.tender_validation --predictions data/tender_predictions.csv --events data/procurement_events.csv --output data/tender_prediction_validation.csv

      - name: Run procurement regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*procurement*.py' -v
          python -m unittest discover -s tests -p 'test_tender_validation.py' -v
          python -m unittest discover -s tests -p 'test_product_matching.py' -v
          python -m unittest discover -s tests -p 'test_faram_product_matching.py' -v
          python -m unittest discover -s tests -p 'test_historical_quote_intelligence.py' -v
          python -m unittest discover -s tests -p 'test_commercial_memory.py' -v
          python -m unittest discover -s tests -p 'test_account_commercial_memory.py' -v
          python -m unittest discover -s tests -p 'test_buyer_intelligence.py' -v
          python -m unittest discover -s tests -p 'test_commercial_account_priority.py' -v
          python -m unittest discover -s tests -p 'test_commercial_action_queue.py' -v
          python -m unittest discover -s tests -p 'test_commercial_opportunity_workspace.py' -v

      - name: Commit refreshed procurement data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/procurement_events.csv /tmp/procurement_events.csv
          cp data/procurement_buyer_history.csv /tmp/procurement_buyer_history.csv
          cp data/procurement_product_matches.csv /tmp/procurement_product_matches.csv
          cp data/faram_product_matches.csv /tmp/faram_product_matches.csv
          cp data/faram_historical_quote_summary.csv /tmp/faram_historical_quote_summary.csv
          cp data/faram_commercial_memory.csv /tmp/faram_commercial_memory.csv
          cp data/faram_commercial_memory_summary.csv /tmp/faram_commercial_memory_summary.csv
          cp data/faram_account_commercial_memory.csv /tmp/faram_account_commercial_memory.csv
          cp data/commercial_account_priority.csv /tmp/commercial_account_priority.csv
          cp data/commercial_action_queue.csv /tmp/commercial_action_queue.csv
          cp data/commercial_opportunity_workspace.csv /tmp/commercial_opportunity_workspace.csv
          cp data/tender_prediction_validation.csv /tmp/tender_prediction_validation.csv
          cp data/iati_intelligence.db /tmp/iati_intelligence.db
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/procurement_events.csv data/procurement_events.csv
            cp /tmp/procurement_buyer_history.csv data/procurement_buyer_history.csv
            cp /tmp/procurement_product_matches.csv data/procurement_product_matches.csv
            cp /tmp/faram_product_matches.csv data/faram_product_matches.csv
            cp /tmp/faram_historical_quote_summary.csv data/faram_historical_quote_summary.csv
            cp /tmp/faram_commercial_memory.csv data/faram_commercial_memory.csv
            cp /tmp/faram_commercial_memory_summary.csv data/faram_commercial_memory_summary.csv
            cp /tmp/faram_account_commercial_memory.csv data/faram_account_commercial_memory.csv
            cp /tmp/commercial_account_priority.csv data/commercial_account_priority.csv
            cp /tmp/commercial_action_queue.csv data/commercial_action_queue.csv
            cp /tmp/commercial_opportunity_workspace.csv data/commercial_opportunity_workspace.csv
            cp /tmp/tender_prediction_validation.csv data/tender_prediction_validation.csv
            cp /tmp/iati_intelligence.db data/iati_intelligence.db
            git add data/procurement_events.csv data/procurement_buyer_history.csv data/procurement_product_matches.csv data/faram_product_matches.csv data/faram_historical_quote_summary.csv data/faram_commercial_memory.csv data/faram_commercial_memory_summary.csv data/faram_account_commercial_memory.csv data/commercial_account_priority.csv data/commercial_action_queue.csv data/commercial_opportunity_workspace.csv data/tender_prediction_validation.csv data/iati_intelligence.db
            if git diff --cached --quiet; then echo "No procurement data changes to commit."; exit 0; fi
            git commit -m "Automated external procurement refresh"
            if git push origin HEAD:main; then echo "Procurement refresh pushed successfully on attempt $attempt."; exit 0; fi
            echo "Push raced with a new main commit; retrying (attempt $attempt)."
          done
          echo "Unable to push procurement refresh after 5 attempts."; exit 1
