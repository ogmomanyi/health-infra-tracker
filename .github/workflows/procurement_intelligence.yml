name: External Procurement Intelligence

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh external procurement sources
        env:
          AFDB_PROCUREMENT_FEED_URL: ${{ vars.AFDB_PROCUREMENT_FEED_URL }}
          UNDP_PROCUREMENT_URL: ${{ vars.UNDP_PROCUREMENT_URL }}
        run: |
          args=(
            --source all
            --country KE
            --country UG
            --country RW
            --country ET
            --country SO
            --country SS
            --country CD
          )

          if [ -n "$AFDB_PROCUREMENT_FEED_URL" ]; then
            args+=(--afdb-feed-url "$AFDB_PROCUREMENT_FEED_URL")
          else
            args+=(--afdb-page-url "https://www.afdb.org/en/documents/project-related-procurement/procurement-notices/specific-procurement-notices")
            args+=(--afdb-page-url "https://www.afdb.org/en/documents/project-related-procurement/procurement-notices/general-procurement-notices")
            args+=(--afdb-page-url "https://www.afdb.org/en/documents/project-related-procurement/procurement-notices/invitation-bids")
          fi

          if [ -n "$UNDP_PROCUREMENT_URL" ]; then
            args+=(--undp-url "$UNDP_PROCUREMENT_URL")
          fi

          python -m procurement_intelligence.run "${args[@]}"

      - name: Validate tender predictions
        run: |
          python -m procurement_intelligence.tender_validation \
            --predictions data/tender_predictions.csv \
            --events data/procurement_events.csv \
            --output data/tender_prediction_validation.csv

      - name: Run procurement regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*procurement*.py' -v
          python -m unittest discover -s tests -p 'test_tender_validation.py' -v

      - name: Commit refreshed procurement data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The collection can take a long time, so main may move while it runs.
          # Only generated procurement outputs are carried forward; application code
          # stays at the newest main revision. Retry the final push to close the
          # small race between the last fetch and the push.
          cp data/procurement_events.csv /tmp/procurement_events.csv
          cp data/tender_prediction_validation.csv /tmp/tender_prediction_validation.csv
          cp data/iati_intelligence.db /tmp/iati_intelligence.db

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/procurement_events.csv data/procurement_events.csv
            cp /tmp/tender_prediction_validation.csv data/tender_prediction_validation.csv
            cp /tmp/iati_intelligence.db data/iati_intelligence.db
            git add data/procurement_events.csv data/tender_prediction_validation.csv data/iati_intelligence.db

            if git diff --cached --quiet; then
              echo "No procurement data changes to commit."
              exit 0
            fi

            git commit -m "Automated external procurement refresh"

            if git push origin HEAD:main; then
              echo "Procurement refresh pushed successfully on attempt $attempt."
              exit 0
            fi

            echo "Push raced with a new main commit; retrying (attempt $attempt)."
          done

          echo "Unable to push procurement refresh after 5 attempts."
          exit 1
