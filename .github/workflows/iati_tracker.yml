name: IATI Health Project Tracker

on:
  schedule:
    - cron: "0 6 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Ensure Data Directory Exists
        run: |
          mkdir -p data
          mkdir -p data/history

      - name: Execute IATI Pipeline
        env:
          IATI_API_KEY: ${{ secrets.IATI_API_KEY }}
        run: |
          python iati_tracker.py \
            --output-dir data \
            --database data/iati_intelligence.db \
            --state-file data/projects_state.json \
            --snapshot-dir data/history \
            --rows 1000 \
            --max-pages 50 \
            --sleep 13

      - name: Refresh canonical entity model
        run: python repair_03d_entity_model.py

      - name: Migrate stale entity references
        run: python migrate_03d_entity_references.py

      - name: Rebuild approved semantic relationships
        run: python rebuild_semantic_relationships.py

      - name: Rebuild intelligence and commercial outputs
        run: python run_intelligence_pipeline.py

      - name: Validate intelligence output contract
        run: python -m pytest -q

      - name: Validate 03D canonical entity model
        run: python validate_03d_entity_model.py

      - name: Validate canonical references
        run: python validate_03d_canonical_references.py

      - name: Validate production relationships
        run: python test_production_relationships.py

      - name: Validate regression continuity
        run: python validate_03d_regression.py --old-ref HEAD^

      - name: Show Dataset Summary
        run: |
          echo "Generated datasets:"
          ls -lh data/

          echo ""
          echo "History:"
          find data/history -maxdepth 2 -type f | sort | tail -30

      - name: Commit Updated Datasets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes detected."
          else
            git commit -m "auto: update IATI health intelligence data"
            git push
          fi
